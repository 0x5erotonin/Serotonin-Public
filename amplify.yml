version: 1

# FRONTEND-ONLY build spec — deploy this to get a working site now.
#
# There is deliberately no `backend:` phase here. Amplify therefore never runs
# `npx ampx pipeline-deploy`, so nothing about the backend definitions can fail
# the build. amplify_outputs.json is never written, and the app runs on durable
# on-device storage: drafts persist, documents upload and download, auto-review
# runs with keyword matching. Nothing syncs across devices, and the Storage &
# Security panel in the app says so.
#
# This is also a diagnostic. If THIS build goes green, the failure is definitively
# in the backend phase, and the frontend is fine. If this build also fails, the
# error is in the frontend build and will be visible in the much shorter log.
#
# To bring the backend back, replace this file with amplify.with-backend.yml.

frontend:
  phases:
    preBuild:
      commands:
        - if [ -f package-lock.json ]; then npm ci --include=dev --cache .npm --prefer-offline; else npm install --include=dev --cache .npm --prefer-offline; fi
        - node --version && npm --version
    build:
      commands:
        - npm run build
        - echo "Frontend build finished. Contents of dist:" && ls -la dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
